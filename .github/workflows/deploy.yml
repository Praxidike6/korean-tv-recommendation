name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate browser configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'window.ENV = {\n' > config.js
          printf "  SUPABASE_URL: '%s',\n" "$SUPABASE_URL" >> config.js
          printf "  SUPABASE_PUBLISHABLE_KEY: '%s'\n" "$SUPABASE_PUBLISHABLE_KEY" >> config.js
          printf '};\n' >> config.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github,.gitignore,node_modules,config.example.js,supabase,tests,EDITOR-SETUP.md'
