<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <title>Korean TV Watchlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link
      rel="stylesheet"
      href="style.css" />
  </head>
  <body
    class="bg-[#0B0F19] text-gray-100 min-h-screen font-sans antialiased"
    x-data="watchlistApp()">
    <!-- Walking Sophie Widget -->
    <img
      src="Sophie_Trans_3.png"
      alt="Sophie walking"
      class="sophie-walker" />

    <!-- Top Header -->
    <header
      class="max-w-7xl mx-auto px-4 py-6 border-b border-gray-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div
          class="inline-block px-3 py-1 mb-2 text-xs font-semibold tracking-wider text-pink-400 uppercase bg-pink-950/50 rounded-full border border-pink-800/50">
          Public Media Dashboard
        </div>
        <h1
          class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
          Korean
          <span
            class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500">
            TV Watchlist
          </span>
        </h1>
        <p class="text-sm text-gray-400 mt-1">
          Alphabetical by genre. Track watch, download, and request status with
          automatic backup persistence.
        </p>
      </div>

      <!-- Progress Widget & Actions -->
      <div
        class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
        <div
          class="bg-gray-900/80 border border-gray-800 rounded-xl p-3 min-w-[220px]">
          <div
            class="flex justify-between text-xs font-semibold mb-1 text-gray-300">
            <span>Watch Progress</span>
            <span x-text="progressPercent + '%'">0%</span>
          </div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
            <div
              class="bg-gradient-to-r from-blue-500 to-indigo-500 h-full transition-all duration-300"
              :style="'width: ' + progressPercent + '%'"></div>
          </div>
          <div class="flex justify-between text-[11px] text-gray-400 mt-1">
            <span x-text="watchedCount + ' Watched'">0 Watched</span>
            <span x-text="downloadedCount + ' Downloaded'">0 Downloaded</span>
            <span x-text="totalCount + ' Total'">320 Total</span>
          </div>
        </div>

        <div class="flex gap-2">
          <button
            @click="exportData()"
            class="flex-1 sm:flex-none px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-xl border border-gray-700 transition">
            Export Backup
          </button>
          <label
            class="flex-1 sm:flex-none px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-semibold rounded-xl border border-gray-700 transition cursor-pointer text-center">
            Import Backup
            <input
              type="file"
              @change="importData($event)"
              class="hidden"
              accept=".json" />
          </label>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
      <!-- DOWNLOAD THESE PLEASE WISHLIST SECTION -->
      <section
        class="bg-gradient-to-r from-indigo-950/40 via-purple-950/30 to-gray-900 border border-indigo-800/40 rounded-2xl p-5 shadow-xl">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2">
            <span
              class="inline-block w-3 h-3 rounded-full bg-indigo-500 animate-pulse"></span>
            <h2 class="text-lg font-bold text-white tracking-wide">
              Download these please
            </h2>
          </div>
          <span
            class="text-xs font-semibold px-2.5 py-1 bg-indigo-900/60 text-indigo-300 rounded-full border border-indigo-700/50"
            x-text="requestedList.length + ' requested'">
            0 requested
          </span>
        </div>

        <template x-if="requestedList.length === 0">
          <p class="text-xs text-gray-400 italic py-2">
            No download requests active. Click "Request download" on any show
            card below to add it here.
          </p>
        </template>

        <div
          class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"
          x-show="requestedList.length > 0">
          <template
            x-for="show in requestedList"
            :key="show.name">
            <div
              class="bg-gray-900/90 border border-indigo-900/50 rounded-xl p-3 flex flex-col justify-between shadow-sm">
              <div>
                <div class="flex justify-between items-start gap-2">
                  <h3
                    class="font-semibold text-sm text-white truncate"
                    x-text="show.name"></h3>
                  <span
                    class="text-[11px] font-bold text-amber-400 shrink-0"
                    x-text="show.imdb ? '⭐ ' + show.imdb : ''"></span>
                </div>
                <div class="text-[11px] text-gray-400 mt-1 flex gap-2">
                  <span x-text="show.year"></span>
                  <span>•</span>
                  <span
                    x-text="'S' + show.s + ' E' + (show.end || 'N/A')"
                    class="text-cyan-400 font-medium"></span>
                </div>
              </div>
              <div
                class="mt-3 pt-2 border-t border-gray-800 flex justify-between items-center text-xs">
                <span
                  class="text-indigo-300 text-[11px] font-medium"
                  x-text="show.genre"></span>
                <label
                  class="flex items-center gap-1.5 cursor-pointer text-emerald-400 font-medium hover:text-emerald-300">
                  <input
                    type="checkbox"
                    @change="toggleDownloaded(show.name)"
                    :checked="states[show.name]?.downloaded"
                    class="rounded bg-gray-800 border-gray-700 text-emerald-500 focus:ring-0" />
                  Mark Downloaded
                </label>
              </div>
            </div>
          </template>
        </div>
      </section>

      <!-- Search Bar -->
      <div class="relative">
        <input
          type="text"
          x-model="searchQuery"
          placeholder="Search by title, genre, year..."
          class="w-full bg-gray-900/80 border border-gray-800 rounded-xl px-4 py-3 pl-11 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-purple-500 transition shadow-inner" />
        <svg
          class="w-5 h-5 text-gray-500 absolute left-3.5 top-3.5"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Genre Sections -->
      <div class="space-y-10">
        <template
          x-for="genre in sortedGenres"
          :key="genre">
          <div
            x-show="getShowsByGenre(genre).length > 0"
            class="space-y-4">
            <div class="flex items-center gap-3 border-b border-gray-800 pb-2">
              <h2
                class="text-lg font-bold text-white tracking-wide"
                x-text="'# ' + genre"></h2>
              <span
                class="text-xs px-2 py-0.5 bg-gray-800 text-gray-400 rounded-md font-medium"
                x-text="getShowsByGenre(genre).length + ' items'"></span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              <template
                x-for="show in getShowsByGenre(genre)"
                :key="show.name">
                <div
                  class="bg-gray-900/60 hover:bg-gray-900/90 border border-gray-800 hover:border-gray-700 rounded-xl p-4 flex flex-col justify-between transition group relative shadow-md">
                  <div
                    class="absolute top-3 right-3 flex items-center gap-1.5 bg-gray-950/80 px-2 py-1 rounded-lg border border-gray-800">
                    <label
                      class="text-[11px] font-medium text-purple-300 cursor-pointer select-none">
                      Request download
                    </label>
                    <input
                      type="checkbox"
                      @change="toggleRequest(show.name)"
                      :checked="states[show.name]?.requested"
                      class="rounded bg-gray-800 border-gray-700 text-purple-500 focus:ring-0 cursor-pointer" />
                  </div>

                  <div>
                    <div class="pr-32">
                      <h3
                        class="font-bold text-base text-white tracking-wide group-hover:text-purple-300 transition"
                        x-text="show.name"></h3>
                    </div>
                    <div
                      class="flex items-center gap-3 mt-2 text-xs text-gray-400">
                      <span
                        class="flex items-center gap-1"
                        x-show="show.year">
                        <span>📅</span>
                        <span x-text="show.year"></span>
                      </span>
                      <span
                        class="text-amber-400 font-semibold flex items-center gap-1"
                        x-show="show.imdb">
                        <span>⭐</span>
                        <span x-text="show.imdb"></span>
                      </span>
                      <span
                        class="text-cyan-400 font-bold bg-cyan-950/40 px-2 py-0.5 rounded border border-cyan-900/40"
                        x-text="'S' + show.s + (show.end ? ' E' + show.end : '')"></span>
                    </div>
                  </div>

                  <div
                    class="mt-5 pt-3 border-t border-gray-800/80 flex items-center justify-between text-xs">
                    <label
                      class="flex items-center gap-2 cursor-pointer text-gray-300 hover:text-white">
                      <input
                        type="checkbox"
                        @change="toggleWatched(show.name)"
                        :checked="states[show.name]?.watched"
                        class="rounded bg-gray-800 border-gray-700 text-blue-500 focus:ring-0" />
                      Watched
                    </label>
                    <label
                      class="flex items-center gap-2 cursor-pointer text-gray-300 hover:text-white">
                      <input
                        type="checkbox"
                        @change="toggleDownloaded(show.name)"
                        :checked="states[show.name]?.downloaded"
                        class="rounded bg-gray-800 border-gray-700 text-emerald-500 focus:ring-0" />
                      Downloaded
                    </label>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </main>

    <script>
      const tvShowsData = [
        {
          name: 'A shop for killers',
          year: '2024',
          s: '1',
          end: '8',
          imdb: '8.2',
          genre: 'Action',
        },
        {
          name: 'Agent Kim Reactivated',
          year: '2026',
          s: '1',
          end: '',
          imdb: '7.6',
          genre: 'Action',
        },
        // ... (all your other tv shows data remain identical)
      ];

      function watchlistApp() {
        return {
          shows: tvShowsData,
          searchQuery: '',
          states: JSON.parse(localStorage.getItem('korean_tv_states') || '{}'),
          init() {
            this.shows.forEach((s) => {
              if (!this.states[s.name]) {
                this.states[s.name] = {
                  watched: false,
                  downloaded: false,
                  requested: false,
                };
              }
            });
          },
          saveStates() {
            localStorage.setItem(
              'korean_tv_states',
              JSON.stringify(this.states),
            );
          },
          toggleWatched(name) {
            if (!this.states[name])
              this.states[name] = {
                watched: false,
                downloaded: false,
                requested: false,
              };
            this.states[name].watched = !this.states[name].watched;
            this.saveStates();
          },
          toggleDownloaded(name) {
            if (!this.states[name])
              this.states[name] = {
                watched: false,
                downloaded: false,
                requested: false,
              };
            this.states[name].downloaded = !this.states[name].downloaded;
            if (this.states[name].downloaded) {
              this.states[name].requested = false;
            }
            this.saveStates();
          },
          toggleRequest(name) {
            if (!this.states[name])
              this.states[name] = {
                watched: false,
                downloaded: false,
                requested: false,
              };
            this.states[name].requested = !this.states[name].requested;
            this.saveStates();
          },
          get sortedGenres() {
            const genres = [...new Set(this.shows.map((s) => s.genre))];
            return genres.sort();
          },
          getShowsByGenre(genre) {
            return this.shows.filter((s) => {
              const matchesGenre = s.genre === genre;
              const q = this.searchQuery.toLowerCase();
              const matchesSearch =
                !q ||
                s.name.toLowerCase().includes(q) ||
                s.genre.toLowerCase().includes(q) ||
                String(s.year).includes(q);
              return matchesGenre && matchesSearch;
            });
          },
          get requestedList() {
            return this.shows.filter(
              (s) =>
                this.states[s.name]?.requested &&
                !this.states[s.name]?.downloaded,
            );
          },
          get totalCount() {
            return this.shows.length;
          },
          get watchedCount() {
            return Object.values(this.states).filter((st) => st.watched).length;
          },
          get downloadedCount() {
            return Object.values(this.states).filter((st) => st.downloaded)
              .length;
          },
          get progressPercent() {
            if (this.totalCount === 0) return 0;
            return Math.round((this.watchedCount / this.totalCount) * 100);
          },
          exportData() {
            const dataStr =
              'data:text/json;charset=utf-8,' +
              encodeURIComponent(JSON.stringify(this.states, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute('href', dataStr);
            dlAnchorElem.setAttribute(
              'download',
              'korean_tv_watchlist_backup.json',
            );
            document.body.appendChild(dlAnchorElem);
            dlAnchorElem.click();
            dlAnchorElem.remove();
          },
          importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                this.states = JSON.parse(e.target.result);
                this.saveStates();
                alert('Backup imported successfully!');
              } catch (err) {
                alert('Invalid JSON backup file.');
              }
            };
            reader.readAsText(file);
          },
        };
      }
    </script>
  </body>
</html>
